# VIRALCLIP AI — Blueprint de Render (camino B, sin tarjeta).
# Uso: con el repo en GitHub, en Render: New + → Blueprint → elige el repo.
# Render crea el Web Service Free desde este archivo. Las variables con
# sync: false hay que rellenarlas a mano en el panel de Render (son secretos).
# NO pongas STORAGE_BACKEND=local en Render: el disco no es persistente.
# Ver docs/DESPLIEGUE.md §3.2. Plan Free: 0,1 CPU / 512 MB RAM; duerme a
# los 15 min sin tráfico. El procesamiento pesado puede fallar por memoria
# (ver DESPLIEGUE.md §3.2, riesgo no verificado).
services:
  - type: web
    name: viralclip-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ADDRESSING_STYLE
        value: path
      - key: STORAGE_QUOTA_GB
        value: "1"
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: CLIP_RETENTION_DAYS
        value: "7"
      - key: MAX_CONCURRENT_STREAMS
        value: "3"
      - key: MAX_UPLOAD_GB
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        value: viralclip-ai
      - key: S3_REGION
        sync: false
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false

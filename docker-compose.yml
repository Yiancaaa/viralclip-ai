# VIRALCLIP AI — docker-compose de PRODUCCIÓN (camino A: Oracle Always Free).
# Uso: cp .env.production.example .env  (rellenar valores)  y luego
# ./deploy.sh  o  docker compose up -d --build
# Desarrollo local sin Docker: venv + SQLite (ver README.md); este compose
# es para el servidor, donde la base de datos es Postgres y el storage es
# S3/R2 por variables de entorno. Sin secretos en este archivo: todo viene
# de .env (no versionado).
services:
  api:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # DATABASE_URL viene de .env. Por defecto, Postgres del servicio db
      # con la contraseña de POSTGRES_PASSWORD (obligatoria, ver db).
      - DATABASE_URL=${DATABASE_URL:-postgresql://viralclip:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}@db:5432/viralclip}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-s3}
    volumes:
      # Trabajo temporal del pipeline (transcripciones, ASS, renders en curso).
      # Los clips finales viven en R2/S3, no aquí.
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    restart: unless-stopped

  worker:
    build: .
    # Scheduler de expiración (1 vez/hora) + limpieza. El procesamiento de
    # jobs se ejecuta de momento de forma síncrona desde
    # POST /api/videos/{id}/process.
    command: ["python", "-m", "worker.scheduler"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://viralclip:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}@db:5432/viralclip}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-s3}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=viralclip
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      - POSTGRES_DB=viralclip
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viralclip -d viralclip"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
